# A Windows build links the C runtime into the .exe: a fresh Windows has no VCRUNTIME140.dll, so a receiver
# built against it would not start there (found in a clean Windows 11 VM; CI runners have the runtime).
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
