[package]
name = "pi-speech-receiver"
version = "0.3.0"
edition = "2021"
description = "Receiver for the pi-speech playback bridge: play, record, and transcribe with local speech models"
license = "MIT"

[features]
default = ["static"]
static = ["sherpa-onnx/static"]
shared = ["sherpa-onnx/shared"]

[lib]
name = "pi_speech_receiver"
path = "src/lib.rs"

[[bin]]
name = "pi-speech-receiver"
path = "src/main.rs"

[dependencies]
# The built-in audio engine: devices (PulseAudio when it runs, else ALSA on Linux; CoreAudio
# on macOS; WASAPI on Windows) and decoding.
cpal = { version = "0.18.2", features = ["pulseaudio"] }
symphonia = { version = "0.6.1", default-features = false, features = ["pcm", "wav", "mp3", "id3v1", "id3v2"] }
# Local speech models run in-process: sherpa-onnx with ONNX Runtime, linked statically from the
# project's prebuilt archives by default (fetched by sherpa-onnx-sys's build script; on Windows the
# static-MT archive, which matches this crate's +crt-static build). The `shared` feature links the
# shared libraries in SHERPA_ONNX_LIB_DIR instead (the release does, on Linux x64 and Windows x64,
# from sherpa-onnx's CUDA bundle): they go beside the binary, and a GPU run finds ONNX Runtime's
# CUDA provider beside it (or via the bundle's directory first on the library path).
sherpa-onnx = { version = "2.0.1", default-features = false }
# Gradium Phonon on-device TTS (pure Rust via `xn`, CPU streaming).
ptts = { version = "0.7.1", default-features = false, features = ["hf"] }
# Random bytes (tokens, ids, file names) from the operating system, on every system.
getrandom = "0.3"
# Model downloads (`models`): HTTPS with rustls and bundled roots (no system TLS library),
# pure-Rust bzip2 and tar, and SHA-256 checks. The catalogue and the output are JSON.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
bzip2 = "0.6"
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
# Signals, process groups, poll.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Console control handlers, process control (job objects), dynamic library probing (gpu), and WSAPoll.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.release]
panic = "unwind"
strip = true
