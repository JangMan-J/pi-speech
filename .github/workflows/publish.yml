name: Publish

# Push a tag that matches package.json, e.g. `npm version patch && git push --follow-tags`.
# npm authenticates this workflow by OIDC (trusted publishing): no npm token is stored,
# and every published version carries a provenance attestation automatically.
#
# A release is six npm packages at one version: a platform package per target
# (@jangmanj/pi-speech-<os>-<cpu>, the receiver binary in bin/, generated by npm/platforms.mjs)
# and the main package, which lists them all as optionalDependencies so npm installs only the
# one for the installing machine. The platform packages are published first and the main
# package last, so the main package never points at a platform package that is not there.
# Every package needs its own trusted publisher on npmjs.com, linked to this workflow and the
# `npm` environment (npm run bootstrap:npm creates and links any that are missing).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The receiver for each target, built on a native runner of that system and processor. No
  # caches: a release build starts from the lock file alone. sherpa-onnx-sys's build script
  # downloads sherpa-onnx's static libraries (on Windows the static-MT archive, matching
  # receiver/.cargo/config.toml's +crt-static).
  build:
    name: Receiver for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        # Must match TARGETS in npm/platforms.mjs; the publish job fails on a missing one.
        # Linux builds on Ubuntu 22.04 (glibc 2.35), not ubuntu-latest (24.04, glibc 2.39): a binary
        # runs only on a glibc at least as new as the one it was built against, so the older runner
        # reaches more systems. ci.yml's receiver job only tests, so it stays on ubuntu-latest.
        include:
          - { target: linux-x64, runner: ubuntu-22.04, arch: X64 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm, arch: ARM64 }
          - { target: darwin-arm64, runner: macos-latest, arch: ARM64 }
          - { target: darwin-x64, runner: macos-15-intel, arch: X64 }
          - { target: win32-x64, runner: windows-latest, arch: X64 }
    env:
      PI_SPEECH_AUDIO_NULL: "1"
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: The runner must be the target's processor
        run: |
          if [ "${{ runner.arch }}" != "${{ matrix.arch }}" ]; then
            echo "::error::${{ matrix.runner }} is ${{ runner.arch }}, ${{ matrix.target }} needs ${{ matrix.arch }}"
            exit 1
          fi
      - name: Install the ALSA development library (the audio engine links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Build the release binary
        run: cargo build --release --locked
      - name: Smoke-test the release binary (models list prints JSON lines)
        run: |
          bin=target/release/pi-speech-receiver
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" models list > models.jsonl
          cat models.jsonl
          node -e '
            const lines = require("fs").readFileSync("models.jsonl", "utf8").split(/\r?\n/).filter(Boolean);
            if (!lines.length) throw new Error("models list printed nothing");
            for (const line of lines) {
              const model = JSON.parse(line);
              if (typeof model?.id !== "string") throw new Error("not a model line: " + line);
            }
            console.log("models list: " + lines.length + " JSON lines");
          '
      - name: Check the Windows binary needs no Visual C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          exe=target/release/pi-speech-receiver.exe
          if command -v objdump >/dev/null; then
            objdump -p "$exe" | grep 'DLL Name' > imports.txt
          else
            grep -aoi '[a-z0-9_-]*\.dll' "$exe" | sort -u > imports.txt
          fi
          cat imports.txt
          if grep -qi 'vcruntime140' imports.txt; then
            echo "pi-speech-receiver.exe imports VCRUNTIME140.dll: a fresh Windows cannot start it" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ matrix.target }}
          path: |
            receiver/target/release/pi-speech-receiver
            receiver/target/release/pi-speech-receiver.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - name: npm must support trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing (needs 11.5.1 or later)"; exit 1; }
      - name: The tag must match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@v4
        with:
          pattern: receiver-*
          path: artifacts
      - name: Generate the platform packages
        run: |
          for target in $(node npm/platforms.mjs targets); do
            exe=pi-speech-receiver
            [ "${target%%-*}" = win32 ] && exe=pi-speech-receiver.exe
            node npm/platforms.mjs build --target "$target" --binary "artifacts/receiver-$target/$exe" --out "npm/dist/$target"
            npm pack --dry-run "./npm/dist/$target"
          done
      - name: Publish the platform packages (first)
        env:
          # npm explains a failed trusted-publishing (OIDC) exchange only at verbose level;
          # without it a failure shows up as a bare E404 on the upload.
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          for target in $(node npm/platforms.mjs targets); do
            dir="npm/dist/$target"
            name="$(node -p "require('./$dir/package.json').name")"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "::notice::${name}@${version} is already on npm; skipping npm publish"
            else
              npm publish "./$dir"
            fi
          done
      - name: List the platform packages in the main package
        run: |
          node npm/platforms.mjs stamp
          node npm/platforms.mjs verify-stamped
          npm pack --dry-run
      - name: Is this version already on npm?
        id: registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the main package (last)
        if: steps.registry.outputs.published == 'false'
        run: npm publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
