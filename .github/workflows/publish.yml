name: Publish

# Push a tag that matches package.json, e.g. `npm version patch && git push --follow-tags`.
# A release whose receiver/ did not change since the last one reuses that release's receivers (see plan).
# npm authenticates this workflow by OIDC (trusted publishing): no npm token is stored,
# and every published version carries a provenance attestation automatically.
#
# A release publishes the small JS/TS extension + `receivers.json` to npm, and uploads each
# platform's receiver archive (`pi-speech-receiver-<os>-<cpu>.tar.gz`) to the GitHub Release.
# The extension fetches the user's (or Remote machine's) binary on demand into its cache,
# checked against `receivers.json`'s SHA-256.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

# sherpa-onnx's CUDA bundles, whose shared libraries the optional GPU receivers link (and carry);
# they must match the sherpa-onnx crate version in Cargo.lock.
env:
  GPU_BUNDLE_13: sherpa-onnx-v2.0.1-cuda-13.x-cudnn-9.x-onnxruntime1.28.2-linux-x64-gpu
  GPU_BUNDLE_13_SHA256: 40ca5c7730a349258f23e9a7bf5c3cbf69f13c498cc50387e8f9f06924a554f8
  GPU_BUNDLE_12: sherpa-onnx-v2.0.1-cuda-12.x-cudnn-9.x-onnxruntime1.28.2-linux-x64-gpu
  GPU_BUNDLE_12_SHA256: 2aa541a65c1e7d921a053283419b70b30c1f6ae0a0f52f64b947ebe88c5f2a77

jobs:
  # Compare with the last release on npm. CI runs only the suites whose files changed since its tag. When
  # receiver/ (and the archive packer) is the same as at the tag the last release's receivers were built
  # from, this release reuses those receivers and their receivers.json instead of building them again.
  plan:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      rebuild: ${{ steps.plan.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          package-manager-cache: false
      - id: plan
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          last="$(npm view "$name" version 2>/dev/null || true)"
          base=""
          rebuild=true
          if [ -n "$last" ] && [ "$last" != "$version" ] && git rev-parse -q --verify "refs/tags/v$last^{commit}" >/dev/null; then
            base="v$last"
            # Anything missing (no tarball, no receivers.json, no tag) means: build the receivers.
            tarball="$(npm view "$name@$last" dist.tarball 2>/dev/null || true)"
            if [ -n "$tarball" ] && curl -fsSL "$tarball" | tar -xzO package/receivers.json > last-receivers.json; then
              built="$(node -p 'require("./last-receivers.json").tag')"
              if git rev-parse -q --verify "refs/tags/$built^{commit}" >/dev/null \
                && git diff --quiet "$built" HEAD -- receiver/ npm/platforms.mjs; then
                rebuild=false
                echo "::notice::receiver/ is unchanged since $built: this release reuses its receivers"
              fi
            fi
          fi
          echo "Last release: ${last:-none}; CI base: ${base:-everything}; build receivers: $rebuild"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"
      - if: steps.plan.outputs.rebuild == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: last-receivers
          path: last-receivers.json
          if-no-files-found: error
          retention-days: 7

  check:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      base: ${{ needs.plan.outputs.base }}

  # The receiver for each CPU and GPU target, built on a native runner of that system and processor.
  # No caches: a release build starts from the lock file alone. All 5 CPU targets are statically
  # linked single binaries; the optional Linux x64 GPU editions link sherpa-onnx's CUDA 12/13
  # shared libraries and carry them beside the binary (found via $ORIGIN rpath).
  build:
    name: Receiver for ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.rebuild == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        # Must match TARGETS + GPU_TARGETS in npm/platforms.mjs.
        # Linux builds on Ubuntu 22.04 (glibc 2.35), not ubuntu-latest (24.04, glibc 2.39).
        include:
          - { target: linux-x64, runner: ubuntu-22.04, arch: X64 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm, arch: ARM64 }
          - { target: darwin-arm64, runner: macos-latest, arch: ARM64 }
          - { target: darwin-x64, runner: macos-15-intel, arch: X64 }
          - { target: win32-x64, runner: windows-latest, arch: X64 }
          - { target: linux-x64-cuda13, runner: ubuntu-22.04, arch: X64, cuda: "13" }
          - { target: linux-x64-cuda12, runner: ubuntu-22.04, arch: X64, cuda: "12" }
    env:
      PI_SPEECH_AUDIO_NULL: "1"
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: The runner must be the target's processor
        run: |
          if [ "${{ runner.arch }}" != "${{ matrix.arch }}" ]; then
            echo "::error::${{ matrix.runner }} is ${{ runner.arch }}, ${{ matrix.target }} needs ${{ matrix.arch }}"
            exit 1
          fi
      - name: Install the ALSA development library (the audio engine links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch sherpa-onnx's CUDA bundle (for GPU editions)
        if: matrix.cuda != ''
        run: |
          if [ "${{ matrix.cuda }}" = "13" ]; then
            bundle="$GPU_BUNDLE_13"
            sha="$GPU_BUNDLE_13_SHA256"
          else
            bundle="$GPU_BUNDLE_12"
            sha="$GPU_BUNDLE_12_SHA256"
          fi
          curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$bundle.tar.bz2" -o gpu.tar.bz2
          echo "$sha  gpu.tar.bz2" | sha256sum -c -
          tar -xjf gpu.tar.bz2
          echo "SHERPA_ONNX_LIB_DIR=$PWD/$bundle/lib" >> "$GITHUB_ENV"
      - name: Build the release binary
        run: cargo build --release --locked ${{ matrix.cuda != '' && '--no-default-features --features shared' || '' }}
      - name: Put the shared libraries beside the GPU binary
        if: matrix.cuda != ''
        run: |
          cp -P "$SHERPA_ONNX_LIB_DIR/"*.so* target/release/
          readelf -d target/release/pi-speech-receiver | grep -q 'RUNPATH.*\$ORIGIN'
      - name: Smoke-test the release binary (models list prints JSON lines)
        run: |
          bin=target/release/pi-speech-receiver
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" models list > models.jsonl
          cat models.jsonl
          node -e '
            const lines = require("fs").readFileSync("models.jsonl", "utf8").split(/\r?\n/).filter(Boolean);
            if (!lines.length) throw new Error("models list printed nothing");
            for (const line of lines) {
              const model = JSON.parse(line);
              if (typeof model?.id !== "string") throw new Error("not a model line: " + line);
            }
            console.log("models list: " + lines.length + " JSON lines");
          '
      - name: Check the Windows binary needs no Visual C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          exe=target/release/pi-speech-receiver.exe
          if command -v objdump >/dev/null; then
            objdump -p "$exe" | grep 'DLL Name' > imports.txt
          else
            grep -aoi '[a-z0-9_-]*\.dll' "$exe" | sort -u > imports.txt
          fi
          cat imports.txt
          if grep -qi 'vcruntime140' imports.txt; then
            echo "pi-speech-receiver.exe imports VCRUNTIME140.dll: a fresh Windows cannot start it" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ matrix.target }}
          path: |
            receiver/target/release/pi-speech-receiver
            receiver/target/release/pi-speech-receiver.exe
            receiver/target/release/*.so*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [plan, check, build]
    # build is skipped when the receivers are reused; any failure or cancellation still stops the release.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.check.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release and upload receiver archives
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - name: npm must support trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing (needs 11.5.1 or later)"; exit 1; }
      - name: The tag must match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.rebuild == 'true'
        with:
          pattern: receiver-*
          path: artifacts
      - name: Collect the built binaries
        if: needs.plan.outputs.rebuild == 'true'
        run: |
          mkdir -p bundle
          for d in artifacts/receiver-*; do
            target="${d#artifacts/receiver-}"
            mkdir -p "bundle/$target"
            cp -P "$d/"* "bundle/$target/"
          done
      - name: Pack release archives and write receivers.json
        if: needs.plan.outputs.rebuild == 'true'
        run: |
          version="$(node -p 'require("./package.json").version')"
          node npm/platforms.mjs release \
            --binaries-dir bundle \
            --assets-dir release-assets \
            --manifest receivers.json \
            --version "$version" \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${GITHUB_REF_NAME}"
          cat receivers.json
          npm pack --dry-run
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.rebuild == 'false'
        with:
          name: last-receivers
      - name: Reuse the last release's receivers.json
        if: needs.plan.outputs.rebuild == 'false'
        run: |
          mv last-receivers.json receivers.json
          cat receivers.json
          npm pack --dry-run
      - name: Create the GitHub release and upload receiver archives (before npm publish)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ needs.plan.outputs.rebuild }}" = "true" ]; then
            if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
              gh release upload "${GITHUB_REF_NAME}" release-assets/*.tar.gz --clobber
            else
              gh release create "${GITHUB_REF_NAME}" release-assets/*.tar.gz --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
            fi
          elif ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            built="$(node -p 'require("./receivers.json").tag')"
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}" \
              --notes "The receiver is unchanged: this release uses the receiver downloads of [$built](https://github.com/${GITHUB_REPOSITORY}/releases/tag/$built)."
          fi
      - name: Is this version already on npm?
        id: registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
