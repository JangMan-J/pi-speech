name: Publish

# Push a tag that matches package.json, e.g. `npm version patch && git push --follow-tags`.
# npm authenticates this workflow by OIDC (trusted publishing): no npm token is stored,
# and every published version carries a provenance attestation automatically.
#
# A release is one npm package carrying every system's receiver binary under bin/<os>-<cpu>/,
# bundled by npm/platforms.mjs from the native builds below. src/engine/binary.ts picks this
# machine's binary at runtime. One package, one trusted publisher (already linked): no bootstrap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

# sherpa-onnx's CUDA 13 bundle, whose shared libraries the Linux x64 receiver links (and carries);
# it must be the version the receiver's sherpa-onnx crate is (Cargo.lock), and the bundle the GPU
# runtime entry of receiver/src/models/catalog.rs names.
env:
  GPU_BUNDLE: sherpa-onnx-v2.0.1-cuda-13.x-cudnn-9.x-onnxruntime1.28.2-linux-x64-gpu
  GPU_BUNDLE_SHA256: 40ca5c7730a349258f23e9a7bf5c3cbf69f13c498cc50387e8f9f06924a554f8

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  # The receiver for each target, built on a native runner of that system and processor. No
  # caches: a release build starts from the lock file alone. sherpa-onnx-sys's build script
  # downloads sherpa-onnx's static libraries (on Windows the static-MT archive, matching
  # receiver/.cargo/config.toml's +crt-static). Linux x64 links the shared libraries of sherpa-onnx's
  # CUDA 13 bundle instead (the `shared` feature), and carries its three core libraries beside the
  # binary: it runs on the CPU as the others do, and on an NVIDIA GPU once the user downloads that
  # bundle (with ONNX Runtime's CUDA provider) as the GPU runtime.
  build:
    name: Receiver for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        # Must match TARGETS in npm/platforms.mjs; the publish job fails on a missing one.
        # Linux builds on Ubuntu 22.04 (glibc 2.35), not ubuntu-latest (24.04, glibc 2.39): a binary
        # runs only on a glibc at least as new as the one it was built against, so the older runner
        # reaches more systems. ci.yml's receiver job only tests, so it stays on ubuntu-latest.
        include:
          - { target: linux-x64, runner: ubuntu-22.04, arch: X64, shared: true }
          - { target: linux-arm64, runner: ubuntu-22.04-arm, arch: ARM64 }
          - { target: darwin-arm64, runner: macos-latest, arch: ARM64 }
          - { target: darwin-x64, runner: macos-15-intel, arch: X64 }
          - { target: win32-x64, runner: windows-latest, arch: X64 }
    env:
      PI_SPEECH_AUDIO_NULL: "1"
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: The runner must be the target's processor
        run: |
          if [ "${{ runner.arch }}" != "${{ matrix.arch }}" ]; then
            echo "::error::${{ matrix.runner }} is ${{ runner.arch }}, ${{ matrix.target }} needs ${{ matrix.arch }}"
            exit 1
          fi
      - name: Install the ALSA development library (the audio engine links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Fetch sherpa-onnx's CUDA bundle (its shared libraries)
        if: matrix.shared
        run: |
          curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$GPU_BUNDLE.tar.bz2" -o gpu.tar.bz2
          echo "$GPU_BUNDLE_SHA256  gpu.tar.bz2" | sha256sum -c -
          tar -xjf gpu.tar.bz2
          echo "SHERPA_ONNX_LIB_DIR=$PWD/$GPU_BUNDLE/lib" >> "$GITHUB_ENV"
      - name: Build the release binary
        run: cargo build --release --locked ${{ matrix.shared && '--no-default-features --features shared' || '' }}
      - name: Put the shared libraries beside the binary
        if: matrix.shared
        run: |
          for lib in libsherpa-onnx-c-api.so libonnxruntime.so libonnxruntime_providers_shared.so; do
            cp "$SHERPA_ONNX_LIB_DIR/$lib" target/release/
          done
          readelf -d target/release/pi-speech-receiver | grep -q 'RUNPATH.*\$ORIGIN'
      - name: Smoke-test the release binary (models list prints JSON lines)
        run: |
          bin=target/release/pi-speech-receiver
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" models list > models.jsonl
          cat models.jsonl
          node -e '
            const lines = require("fs").readFileSync("models.jsonl", "utf8").split(/\r?\n/).filter(Boolean);
            if (!lines.length) throw new Error("models list printed nothing");
            for (const line of lines) {
              const model = JSON.parse(line);
              if (typeof model?.id !== "string") throw new Error("not a model line: " + line);
            }
            console.log("models list: " + lines.length + " JSON lines");
          '
      - name: Check the Windows binary needs no Visual C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          exe=target/release/pi-speech-receiver.exe
          if command -v objdump >/dev/null; then
            objdump -p "$exe" | grep 'DLL Name' > imports.txt
          else
            grep -aoi '[a-z0-9_-]*\.dll' "$exe" | sort -u > imports.txt
          fi
          cat imports.txt
          if grep -qi 'vcruntime140' imports.txt; then
            echo "pi-speech-receiver.exe imports VCRUNTIME140.dll: a fresh Windows cannot start it" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ matrix.target }}
          path: |
            receiver/target/release/pi-speech-receiver
            receiver/target/release/pi-speech-receiver.exe
            receiver/target/release/*.so
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never use caching in release builds
      - name: npm must support trusted publishing (11.5.1 or later)
        run: |
          npm --version
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || { echo "::error::npm $(npm --version) is too old for trusted publishing (needs 11.5.1 or later)"; exit 1; }
      - name: The tag must match package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - uses: actions/download-artifact@v4
        with:
          pattern: receiver-*
          path: artifacts
      - name: Collect the built binaries
        run: |
          mkdir -p bundle
          for target in $(node npm/platforms.mjs targets); do
            exe=pi-speech-receiver
            [ "${target%%-*}" = win32 ] && exe=pi-speech-receiver.exe
            mkdir -p "bundle/$target"
            cp "artifacts/receiver-$target/"* "bundle/$target/"
          done
      - name: Bundle every platform's binary into the package
        run: node npm/platforms.mjs bundle --binaries-dir bundle
      - name: Check the package carries all five binaries
        run: |
          for target in $(node npm/platforms.mjs targets); do
            exe=pi-speech-receiver
            [ "${target%%-*}" = win32 ] && exe=pi-speech-receiver.exe
            test -x "bin/$target/$exe" || { echo "::error::missing bin/$target/$exe"; exit 1; }
          done
          npm pack --dry-run
      - name: Is this version already on npm?
        id: registry
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${name}@${version} is already on npm; skipping npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.registry.outputs.published == 'false'
        run: npm publish
        env:
          NPM_CONFIG_LOGLEVEL: verbose
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::notice::Release ${GITHUB_REF_NAME} already exists"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "${GITHUB_REF_NAME}"
          fi
