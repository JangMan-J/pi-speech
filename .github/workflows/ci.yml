name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The floors live in package.json: engines.node and the pi-coding-agent peer range.
  floors:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.read.outputs.node }}
      pi: ${{ steps.read.outputs.pi }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          node -e '
            const pkg = require("./package.json");
            const floor = (range, what) => {
              const m = /^>=\s*(\d+\.\d+\.\d+)$/.exec(range ?? "");
              if (!m) { console.error(what + " must be \">=X.Y.Z\" in package.json, got " + JSON.stringify(range)); process.exit(1); }
              return m[1];
            };
            console.log("node=" + floor(pkg.engines?.node, "engines.node"));
            console.log("pi=" + floor(pkg.peerDependencies?.["@earendil-works/pi-coding-agent"], "the @earendil-works/pi-coding-agent peer range"));
          ' >> "$GITHUB_OUTPUT"

  check:
    needs: floors
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Node floor, the current LTS, and the newest release, against the locked Pi;
        # plus the lowest Pi the peer range allows.
        node: ["${{ needs.floors.outputs.node }}", "lts/*", "current"]
        pi: [locked]
        include:
          - node: "lts/*"
            pi: floor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use the lowest supported Pi
        if: matrix.pi == 'floor'
        run: npm install --no-save "@earendil-works/pi-ai@${{ needs.floors.outputs.pi }}" "@earendil-works/pi-coding-agent@${{ needs.floors.outputs.pi }}" "@earendil-works/pi-tui@${{ needs.floors.outputs.pi }}"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check the package contents
        run: npm pack --dry-run
      - name: Install the packed tarball and load it in Pi
        run: npm run smoke:pack

  # The extension on the other desktop systems (the Node and Pi matrix above runs on Linux).
  check-os:
    name: Extension on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The receiver, its audio engine and its speech engines (Rust), on every desktop system it ships
  # for. sherpa-onnx-sys's build script downloads sherpa-onnx's static libraries (ONNX Runtime
  # included) into target/sherpa-onnx-prebuilt/; the archive is cached, keyed by the lock file that
  # pins its version. On Windows it is the static-MT archive, matching .cargo/config.toml's
  # +crt-static.
  receiver:
    name: Receiver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Tests never reach a real audio device; an unknown value would fail, not fall back.
      PI_SPEECH_AUDIO_NULL: "1"
      # A real recording through a real model (Parakeet v3 int8, about 465 MB, cached).
      TEST_MODEL: sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development library (the audio engine links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cache the crates and sherpa-onnx's prebuilt archive
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            receiver/target/sherpa-onnx-prebuilt/*.tar.bz2
          key: receiver-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('receiver/Cargo.lock') }}
          restore-keys: receiver-${{ runner.os }}-${{ runner.arch }}-
      - name: Cache the test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: test-models
          key: test-model-${{ env.TEST_MODEL }}
      - name: Download the test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p test-models
          curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$TEST_MODEL.tar.bz2" | tar -xjf - -C test-models
          ls -l "test-models/$TEST_MODEL"
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Build the release binary
        run: cargo build --release
      - name: Report the release binary's size
        run: |
          bin=target/release/pi-speech-receiver
          [ -f "$bin.exe" ] && bin="$bin.exe"
          bytes=$(wc -c < "$bin")
          echo "release binary: $bin, $bytes bytes ($((bytes / 1048576)) MiB)"
          echo "Receiver release binary on ${{ runner.os }}: $bytes bytes ($((bytes / 1048576)) MiB)" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the Windows binary needs no Visual C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          exe=target/release/pi-speech-receiver.exe
          if command -v objdump >/dev/null; then
            objdump -p "$exe" | grep 'DLL Name' > imports.txt
          else
            # No objdump: the DLL names in the import table are plain strings in the file.
            grep -aoi '[a-z0-9_-]*\.dll' "$exe" | sort -u > imports.txt
          fi
          cat imports.txt
          if grep -qi 'vcruntime140' imports.txt; then
            echo "pi-speech-receiver.exe imports VCRUNTIME140.dll: a fresh Windows cannot start it" >&2
            exit 1
          fi
      - name: Transcribe a real recording with the release build
        env:
          PI_SPEECH_TEST_MODELS: ${{ github.workspace }}/test-models
        run: cargo test --release --test transcribe -- --nocapture
      - name: Keep the release binary for testing on real machines
        uses: actions/upload-artifact@v4
        with:
          name: pi-speech-receiver-${{ runner.os }}-${{ runner.arch }}
          path: |
            receiver/target/release/pi-speech-receiver
            receiver/target/release/pi-speech-receiver.exe
          if-no-files-found: error
          retention-days: 14
