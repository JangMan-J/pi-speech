name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "assets/**"
      - "LICENSE"
      - ".gitignore"
  workflow_call:
    inputs:
      # A called workflow sees the caller's event (a tag push is a "push"), so it is told it was called.
      called:
        type: boolean
        default: true
      base:
        description: "A commit already checked in full (the last release's tag); only suites whose files changed since it run. Empty: everything runs."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The floors live in package.json: engines.node and the pi-coding-agent peer range.
  # Also determine which suites need to run: on PRs and branch pushes from the files changed, and from a
  # release (workflow_call) from the files changed since the last release's tag; with no base, everything.
  floors:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.read.outputs.node }}
      pi: ${{ steps.read.outputs.pi }}
      run_extension: ${{ steps.read.outputs.run_extension }}
      run_extension_os: ${{ steps.read.outputs.run_extension_os }}
      run_receiver: ${{ steps.read.outputs.run_receiver }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: read
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          CALLED: ${{ inputs.called }}
          CALL_BASE: ${{ inputs.base }}
        run: |
          node -e '
            const { execFileSync } = require("child_process");
            const pkg = require("./package.json");
            const floor = (range, what) => {
              const m = /^>=\s*(\d+\.\d+\.\d+)$/.exec(range ?? "");
              if (!m) { console.error(what + " must be \">=X.Y.Z\" in package.json, got " + JSON.stringify(range)); process.exit(1); }
              return m[1];
            };
            let runExt = true;
            let runExtOs = true;
            let runRcv = true;
            const called = process.env.CALLED === "true";
            const callBase = process.env.CALL_BASE;
            const pushBefore = process.env.PUSH_BEFORE && !/^0+$/.test(process.env.PUSH_BEFORE) ? process.env.PUSH_BEFORE : "";
            // When main is pushed alongside its release tag (git push --follow-tags), Publish already calls CI.
            const headTags = !called && process.env.EVENT_NAME === "push"
              ? execFileSync("git", ["tag", "--points-at", "HEAD"], { encoding: "utf8" }).split(/\r?\n/).filter(Boolean)
              : [];
            if (headTags.includes("v" + pkg.version)) {
              console.log("Release tag v" + pkg.version + " is on HEAD; Publish runs CI for this release.");
              runExt = false;
              runExtOs = false;
              runRcv = false;
            } else if (called ? callBase : process.env.EVENT_NAME === "push" || process.env.EVENT_NAME === "pull_request") {
              try {
                const base = called ? callBase : process.env.PR_BASE || pushBefore || "HEAD^";
                const changed = execFileSync("git", ["diff", "--name-only", base, "HEAD"], { encoding: "utf8" })
                  .split(/\r?\n/).filter(Boolean);
                if (changed.length > 0) {
                  const extPattern = /^(index\.ts|package(-lock)?\.json|tsconfig\.json|biome\.json|vitest\.config\.ts|src\/|test\/|scripts\/|npm\/)/;
                  // Cross-OS extension jobs (macOS/Windows) only run when platform, process, path, or packaging code changes.
                  const extOsPattern = /^(src\/engine\/(binary|env|remote|local-output|receiver-control)\.ts|src\/pi\/adapter\.ts|test\/engine\/(binary|env|remote)\.test\.ts|scripts\/|npm\/)/;
                  // package.json only gives the receiver its version string: non-receiver edits skip Rust builds.
                  const rcvPattern = /^(receiver\/|e2e\/fixtures\/)/;
                  runExt = changed.some((f) => extPattern.test(f));
                  runExtOs = changed.some((f) => extOsPattern.test(f));
                  runRcv = changed.some((f) => rcvPattern.test(f));
                } else {
                  runExt = false;
                  runExtOs = false;
                  runRcv = false;
                }
              } catch {
                runExt = true;
                runExtOs = true;
                runRcv = true;
              }
            }
            const out = [
              "node=" + floor(pkg.engines?.node, "engines.node"),
              "pi=" + floor(pkg.peerDependencies?.["@earendil-works/pi-coding-agent"], "the @earendil-works/pi-coding-agent peer range"),
              "run_extension=" + runExt,
              "run_extension_os=" + runExtOs,
              "run_receiver=" + runRcv,
            ].join("\n") + "\n";
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out);
          '

  check:
    needs: floors
    if: needs.floors.outputs.run_extension == 'true'
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Primary LTS + locked Pi check, plus a single combined floor job (Node floor + Pi floor).
        include:
          - node: "lts/*"
            pi: locked
          - node: "${{ needs.floors.outputs.node }}"
            pi: floor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use the lowest supported Pi
        if: matrix.pi == 'floor'
        run: npm install --no-save "@earendil-works/pi-ai@${{ needs.floors.outputs.pi }}" "@earendil-works/pi-coding-agent@${{ needs.floors.outputs.pi }}" "@earendil-works/pi-tui@${{ needs.floors.outputs.pi }}"
      - if: matrix.pi == 'locked'
        run: npm run typecheck
      - if: matrix.pi == 'locked'
        run: npm run lint
      - run: npm test
      - name: Check the package contents
        if: matrix.pi == 'locked'
        run: npm pack --dry-run
      - name: Install the packed tarball and load it in Pi
        run: npm run smoke:pack

  # Cross-OS extension checks only run when platform, path, process, or packaging code changed.
  check-os:
    needs: floors
    if: needs.floors.outputs.run_extension_os == 'true'
    name: Extension on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The receiver, its audio engine and its speech engines (Rust), on every desktop system it ships
  # for. Compiled artifacts and sherpa-onnx's prebuilt archive are cached across CI runs; release
  # builds in publish.yml remain uncached.
  receiver:
    needs: floors
    if: needs.floors.outputs.run_receiver == 'true'
    name: Receiver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Tests never reach a real audio device; an unknown value would fail, not fall back.
      PI_SPEECH_AUDIO_NULL: "1"
      # A real recording through a real model (Parakeet v3 int8, about 465 MB, cached).
      TEST_MODEL: sherpa-onnx-nemo-parakeet-tdt-0.6b-v3-int8
      GPU_BUNDLE: sherpa-onnx-v2.0.1-cuda-13.x-cudnn-9.x-onnxruntime1.28.2-linux-x64-gpu
      GPU_BUNDLE_SHA256: 40ca5c7730a349258f23e9a7bf5c3cbf69f13c498cc50387e8f9f06924a554f8
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development library (the audio engine links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Cache sherpa-onnx's prebuilt archive
        uses: actions/cache@v4
        with:
          path: receiver/target/sherpa-onnx-prebuilt/*.tar.bz2
          key: prebuilt-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('receiver/Cargo.lock') }}
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: receiver
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}
      - name: Cache the test model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: test-models
          key: test-model-${{ env.TEST_MODEL }}
      - name: Download the test model
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p test-models
          curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/$TEST_MODEL.tar.bz2" | tar -xjf - -C test-models
          ls -l "test-models/$TEST_MODEL"
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --release --all-targets -- -D warnings
      - name: Run Rust tests and build the release binary
        run: cargo test --release && cargo build --release
      - name: Report the release binary's size
        run: |
          bin=target/release/pi-speech-receiver
          [ -f "$bin.exe" ] && bin="$bin.exe"
          bytes=$(wc -c < "$bin")
          echo "release binary: $bin, $bytes bytes ($((bytes / 1048576)) MiB)"
          echo "Receiver release binary on ${{ runner.os }}: $bytes bytes ($((bytes / 1048576)) MiB)" >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke-test the release binary (models list prints JSON lines)
        run: |
          bin=target/release/pi-speech-receiver
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" models list > models.jsonl
          cat models.jsonl
          node -e '
            const lines = require("fs").readFileSync("models.jsonl", "utf8").split(/\r?\n/).filter(Boolean);
            if (!lines.length) throw new Error("models list printed nothing");
            for (const line of lines) {
              const model = JSON.parse(line);
              if (typeof model?.id !== "string") throw new Error("not a model line: " + line);
            }
            console.log("models list: " + lines.length + " JSON lines");
          '
      - name: Check the Windows binary needs no Visual C++ runtime DLL
        if: runner.os == 'Windows'
        run: |
          exe=target/release/pi-speech-receiver.exe
          if command -v objdump >/dev/null; then
            objdump -p "$exe" | grep 'DLL Name' > imports.txt
          else
            # No objdump: the DLL names in the import table are plain strings in the file.
            grep -aoi '[a-z0-9_-]*\.dll' "$exe" | sort -u > imports.txt
          fi
          cat imports.txt
          if grep -qi 'vcruntime140' imports.txt; then
            echo "pi-speech-receiver.exe imports VCRUNTIME140.dll: a fresh Windows cannot start it" >&2
            exit 1
          fi
      - name: Transcribe a real recording with the release build
        env:
          PI_SPEECH_TEST_MODELS: ${{ github.workspace }}/test-models
        run: cargo test --release --test transcribe -- --nocapture
      - name: Cache sherpa-onnx's Linux x64 shared-library bundle
        if: runner.os == 'Linux' && runner.arch == 'X64'
        id: gpu-bundle-cache
        uses: actions/cache@v4
        with:
          path: receiver/gpu.tar.bz2
          key: gpu-bundle-${{ env.GPU_BUNDLE_SHA256 }}
      # The published Linux x64 receiver links sherpa-onnx's shared libraries (publish.yml): build it
      # that way too, and transcribe with it with only its libraries beside it.
      - name: Build and run the shared-library receiver (Linux x64, as published)
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          if [ ! -f gpu.tar.bz2 ]; then
            curl -fsSL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/$GPU_BUNDLE.tar.bz2" -o gpu.tar.bz2
          fi
          echo "$GPU_BUNDLE_SHA256  gpu.tar.bz2" | sha256sum -c -
          tar -xjf gpu.tar.bz2
          SHERPA_ONNX_LIB_DIR="$PWD/$GPU_BUNDLE/lib" CARGO_TARGET_DIR=target-shared \
            cargo build --release --no-default-features --features shared
          mkdir -p shared && cp target-shared/release/pi-speech-receiver shared/
          for lib in libsherpa-onnx-c-api.so libonnxruntime.so libonnxruntime_providers_shared.so; do
            cp "$GPU_BUNDLE/lib/$lib" shared/
          done
          readelf -d shared/pi-speech-receiver | grep 'RUNPATH.*\$ORIGIN'
          ./shared/pi-speech-receiver models list | head -3
          text=$(./shared/pi-speech-receiver transcribe "${{ github.workspace }}/test-models/$TEST_MODEL" ../e2e/fixtures/quick-brown-fox.wav)
          echo "$text"
          echo "$text" | grep -qi "fox"
      - name: Keep the release binary for testing on real machines
        uses: actions/upload-artifact@v7
        with:
          name: pi-speech-receiver-${{ runner.os }}-${{ runner.arch }}
          path: |
            receiver/target/release/pi-speech-receiver
            receiver/target/release/pi-speech-receiver.exe
          if-no-files-found: error
          retention-days: 14
