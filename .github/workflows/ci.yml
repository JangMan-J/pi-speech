name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The floors live in package.json: engines.node and the pi-coding-agent peer range.
  floors:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.read.outputs.node }}
      pi: ${{ steps.read.outputs.pi }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        run: |
          node -e '
            const pkg = require("./package.json");
            const floor = (range, what) => {
              const m = /^>=\s*(\d+\.\d+\.\d+)$/.exec(range ?? "");
              if (!m) { console.error(what + " must be \">=X.Y.Z\" in package.json, got " + JSON.stringify(range)); process.exit(1); }
              return m[1];
            };
            console.log("node=" + floor(pkg.engines?.node, "engines.node"));
            console.log("pi=" + floor(pkg.peerDependencies?.["@earendil-works/pi-coding-agent"], "the @earendil-works/pi-coding-agent peer range"));
          ' >> "$GITHUB_OUTPUT"

  check:
    needs: floors
    name: Node ${{ matrix.node }} / Pi ${{ matrix.pi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The Node floor, the current LTS, and the newest release, against the locked Pi;
        # plus the lowest Pi the peer range allows.
        node: ["${{ needs.floors.outputs.node }}", "lts/*", "current"]
        pi: [locked]
        include:
          - node: "lts/*"
            pi: floor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Use the lowest supported Pi
        if: matrix.pi == 'floor'
        run: npm install --no-save "@earendil-works/pi-ai@${{ needs.floors.outputs.pi }}" "@earendil-works/pi-coding-agent@${{ needs.floors.outputs.pi }}" "@earendil-works/pi-tui@${{ needs.floors.outputs.pi }}"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Check the package contents
        run: npm pack --dry-run
      - name: Install the packed tarball and load it in Pi
        run: npm run smoke:pack

  # The extension on the other desktop systems (the Node and Pi matrix above runs on Linux).
  check-os:
    name: Extension on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The receiver and audio engine (Rust), on every desktop system it ships for.
  receiver:
    name: Receiver on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Tests never reach a real audio device; an unknown value would fail, not fall back.
      PI_SPEECH_AUDIO_NULL: "1"
    defaults:
      run:
        working-directory: receiver
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install the ALSA development library (the audio engine links it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
        if: runner.os == 'Linux'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
